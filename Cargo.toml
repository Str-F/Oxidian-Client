[package]
name = "oxidian_client"
version = "0.1.0"
edition = "2024"
description = "A headless Minecraft client written in Rust, supporting protocol version 776 (Minecraft 26.2)"
license = "GPL-3.0-or-later"
repository = "https://github.com/Str-F/Oxidian-Client"
readme = "README.md"
keywords = ["minecraft", "client", "protocol"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
env_logger = "0.11.11"
fastnbt = "2.6.3"
flate2 = "1.1.10"
log = "0.4.34"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

[dependencies.uuid]
version = "1.24.0"
features = ["v4"]
